# Profile patch template rendered by tools/cluster.mjs for every cluster instance.
# The renderer fills the port, state directory and desktopPlatform placeholders, the model route
# placeholders, and the `llm-pi-ai` provider block.
#
# Model route: a cluster instance (or its `defaults`) may carry a `model` object in
# ~/.dsh/superagent-cluster.json:
#   "model": { "provider": "deepseek-account", "model": "deepseek-flash", "reasoningEffort": "max" }
# Without one, the DeepSeek account sign-in the DSH Desktop app already has is used. A `model` with a
# `baseURL` also declares that provider as a custom `llm-pi-ai` route (api defaults to
# openai-completions; headers, apiKeyEnv, contextWindow, reasoningEfforts and compat are optional),
# which is how a self-deployed OpenAI-compatible endpoint is used. See tools/README.md.
- id: webserver
  config:
    host: 127.0.0.1
    port: {{port}}
# Use the DeepSeek account sign-in the DSH Desktop app already has (win32/darwin only).
- id: deepseek-account
  config:
    desktopPlatform: {{desktopPlatform}}
- id: llm-deepseek-account
  disabled: false
{{modelProviders}}
- id: agent-default-model
  config:
    provider: {{modelProvider}}
    model: {{modelModel}}
{{modelReasoningEffort}}
- id: dsh-superagent
  config:
    stateDir: '{{stateDir}}'
